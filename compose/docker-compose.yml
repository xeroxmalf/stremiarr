services:
  caddy:
    container_name: caddy
    hostname: caddy
    pull_policy: missing
    image: caddy:cloudflare
    build:
      context: .
      no_cache: true
      dockerfile_inline: |
        FROM caddy:builder AS builder
        RUN xcaddy build --with github.com/caddy-dns/cloudflare
        FROM caddy:latest
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    restart: always
    stop_grace_period: 30s
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /docker-configs/caddy/Caddyfile:/etc/caddy/Caddyfile
      - /docker-configs/caddy/data:/data
      - /docker-configs/caddy/config:/config
    environment:
      - CLOUDFLARE_EMAIL=${CF_EMAIL}
      - CLOUDFLARE_API_TOKEN=${CF_API_TOKEN}
      - ACME_AGREE=true
      - CADDY_AUTH_XM_HASH=${CADDY_AUTH_XM_HASH}
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:2019/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    hostname: rclone
    network_mode: host
    shm_size: 1gb
    restart: always
    stop_grace_period: 30s
    volumes:
      - /docker-configs/rclone:/config/rclone
      - /home/stremthru_cache/rclone:/data/cache
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    command: [
      "serve", "http", "real-debrid-dav:/",
      "--addr", "127.0.0.1:9933",
      "--cache-dir", "/data/cache",
      "--vfs-cache-mode", "full",
      "--vfs-cache-max-size", "250G",
      "--vfs-cache-max-age", "72h",
      "--vfs-read-chunk-size", "64M",
      "--vfs-read-chunk-size-limit", "512M",
      "--vfs-read-ahead", "512M",
      "--buffer-size", "128M",
      "--dir-cache-time", "10s",
      "--vfs-fast-fingerprint",
      "--no-checksum",
      "--no-modtime",
      "--transfers", "8",
      "--checkers", "16",
      "--low-level-retries", "10",
      "--rc",
      "--rc-addr", "127.0.0.1:5572",
      "--rc-no-auth",
      "--stats", "5s",
      "--progress",
      "--stats-one-line",
      "--verbose"
      ]
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:9933/ || exit 1
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  handoff:
    build:
      context: /docker-configs/handoff/src
      dockerfile: Dockerfile
      no_cache: true
    container_name: handoff
    pull_policy: missing
    hostname: handoff
    image: handoff:dev
    restart: always
    stop_grace_period: 30s
    depends_on:
      caddy:
        condition: service_healthy
      rclone:
        condition: service_healthy
      comet:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      - PORT=9944
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RD_API_KEY=${RD_API_KEY}
      - RCLONE_URL=${RCLONE_URL}
      - RCLONE_RC_URL=${RCLONE_RC_URL}
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASS}@127.0.0.1:5432/handoff?sslmode=disable
      - GOMEMLIMIT=1GiB
      - GOGC=100
    network_mode: host
    volumes:
      - /docker-configs/handoff/data:/data
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:9944/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:trixie
    hostname: postgres
    container_name: postgres
    pull_policy: missing
    shm_size: 4gb
    restart: always
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASS}
      - POSTGRES_DB=comet
      - POSTGRES_MULTIPLE_DATABASES=handoff
    volumes:
      - /docker-configs/postgres:/var/lib/postgresql
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    network_mode: host
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=4GB
      -c effective_cache_size=11GB
      -c maintenance_work_mem=1GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=300
      -c work_mem=64MB
      -c min_wal_size=4GB
      -c max_wal_size=16GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
      -c autovacuum_vacuum_scale_factor=0.01
      -c autovacuum_analyze_scale_factor=0.005
      -c autovacuum_vacuum_cost_limit=3000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comet -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  comet:
    image: ghcr.io/g0ldyy/comet:latest
    hostname: comet
    container_name: comet
    pull_policy: missing
    stop_grace_period: 60s
    depends_on:
      caddy:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      - SCRAPE_NYAA=both
      - SCRAPE_SEADEX=both
      - SCRAPE_NEKOBT=both
      - SCRAPE_ZILEAN=both
      - SCRAPE_COMET=both
      - COMET_URL=https://comet.feels.legal
      - ZILEAN_URL=https://zileanfortheweebs.midnightignite.me
      - SCRAPE_STREMTHRU=both
      - STREMTHRU_SCRAPE_URL=https://stremthru.13377001.xyz
      - SCRAPE_DMM=both
      - DMM_INGEST_ENABLED=true
      - DMM_INGEST_CONCURRENT_WORKERS=10
      - DMM_INGEST_INTERVAL=3600
      - DMM_INGEST_BATCH_SIZE=1000
      - BACKGROUND_SCRAPER_RUN_TIME_BUDGET=300
#      - STREMTHRU_URL=https://stremthru.defnotmy.site
      - BITMAGNET_URL=https://bitmagnetfortheweebs.midnightignite.me
      - SCRAPE_TORRENTIO=both
      - TORRENTIO_URL=https://torrentio.strem.fun
      - SCRAPE_MEDIAFUSION=both
      - MEDIAFUSION_URL=https://mediafusion.elfhosted.com
      - SCRAPE_PEERFLIX=both
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASS}@127.0.0.1:5432/comet
      - ADMIN_DASHBOARD_PASSWORD=${COMET_ADMIN_PASS}
      - COMETNET_ADVERTISE_URL=wss://comet.defnotmy.site/cometnet/ws
      - COMETNET_SKIP_REACHABILITY_CHECK=true
      - COMETNET_REACHABILITY_DELAY=60
      - COMETNET_REACHABILITY_RETRIES=10
      - COMETNET_ENABLED=true
      - COMETNET_CONTRIBUTION_MODE=full
      - COMETNET_GOSSIP_FANOUT=12
      - COMETNET_UPNP_ENABLED=true
      - EXECUTOR_MAX_WORKERS=12
      - TORRENT_CACHE_TTL=3600
      - BACKGROUND_SCRAPER_ENABLED=true
      - BACKGROUND_SCRAPER_MAX_MOVIES_PER_RUN=500
      - BACKGROUND_SCRAPER_MAX_SERIES_PER_RUN=10
      - BACKGROUND_SCRAPER_MAX_EPISODES_PER_SERIES_PER_RUN=100
      - BACKGROUND_SCRAPER_INTERVAL=600
    volumes:
      - /docker-configs/comet:/app/data
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    network_mode: host
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}


