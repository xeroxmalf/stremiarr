apiVersion: v1
kind: Service
metadata:
  name: {{ include "stremiarr.fullname" . }}-postgres
  labels:
    {{- include "stremiarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "stremiarr.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
