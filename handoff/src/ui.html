<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Handoff Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 30px;
        }
        h1 { color: #38bdf8; font-size: 1.8em; }
        h2 { color: #38bdf8; margin-bottom: 15px; font-size: 1.3em; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .stat-label { color: #94a3b8; font-size: 0.9em; margin-bottom: 5px; }
        .stat-value { color: #38bdf8; font-size: 1.5em; font-weight: bold; }

        .section {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .source-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #0f172a;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #334155;
        }
        .source-name { color: #38bdf8; font-weight: bold; }
        .source-url { color: #64748b; font-size: 0.85em; font-family: monospace; }

        .toggle {
            position: relative;
            width: 50px;
            height: 26px;
            background: #334155;
            border-radius: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .toggle.active { background: #38bdf8; }
        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: all 0.3s;
        }
        .toggle.active::after { left: 27px; }

        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        button:hover { background: #0ea5e9; }
        button.danger {
            background: #ef4444;
            color: white;
        }
        button.danger:hover { background: #dc2626; }
        button.secondary {
            background: #334155;
            color: #e2e8f0;
        }
        button.secondary:hover { background: #475569; }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .mapping-item {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mapping-name { color: #38bdf8; font-weight: bold; font-size: 0.9em; }
        .mapping-url { color: #64748b; font-size: 0.8em; font-family: monospace; }

        .loading { color: #64748b; font-style: italic; }
        .error { color: #ef4444; }
        .success { color: #22c55e; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 DebridHandoff Admin</h1>
            <button class="secondary" onclick="window.location.href='/dashboard'">View Dashboard</button>
        </header>

        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-label">Total Streams</div>
                <div class="stat-value loading">Loading...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Valid Streams</div>
                <div class="stat-value loading">Loading...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Failed Streams</div>
                <div class="stat-value loading">Loading...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Cached Requests</div>
                <div class="stat-value loading">Loading...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Uptime</div>
                <div class="stat-value loading">Loading...</div>
            </div>
        </div>

        <div class="section">
            <h2>📡 Addon Sources</h2>
            <div id="sources"></div>
            <div class="actions">
                <button onclick="saveSources()">Save Sources</button>
            </div>
        </div>

        <div class="section">
            <h2>🗂️ Mappings</h2>
            <div id="mappings"></div>
        </div>

        <div class="section">
            <h2>🛠️ Maintenance</h2>
            <div class="actions">
                <button class="secondary" onclick="cleanFailed()">Clean Failed Streams</button>
                <button class="danger" onclick="clearCache()">Clear Cache</button>
            </div>
            <div id="status" style="margin-top: 10px;"></div>
        </div>
    </div>

    <script>
        const apiBase = window.location.origin;

        async function loadStats() {
            try {
                const res = await fetch(apiBase + '/api/stats');
                const data = await res.json();

                const stats = document.getElementById('stats');
                stats.innerHTML =
                    '<div class="stat-card">' +
                        '<div class="stat-label">Total Streams</div>' +
                        '<div class="stat-value">' + data.totalStreams + '</div>' +
                    '</div>' +
                    '<div class="stat-card">' +
                        '<div class="stat-label">Valid Streams</div>' +
                        '<div class="stat-value">' + data.validStreams + '</div>' +
                    '</div>' +
                    '<div class="stat-card">' +
                        '<div class="stat-label">Failed Streams</div>' +
                        '<div class="stat-value" style="color: ' + (data.failedStreams > 100 ? '#ef4444' : '#22c55e') + '">' +
                        data.failedStreams + '</div>' +
                    '</div>' +
                    '<div class="stat-card">' +
                        '<div class="stat-label">Cached Requests</div>' +
                        '<div class="stat-value">' + data.cachedRequests + '</div>' +
                    '</div>' +
                    '<div class="stat-card">' +
                        '<div class="stat-label">Uptime</div>' +
                        '<div class="stat-value">' + data.uptime + '</div>' +
                    '</div>';
            } catch (err) {
                console.error('Failed to load stats:', err);
            }
        }

        async function loadSources() {
            try {
                const res = await fetch(apiBase + '/api/sources');
                const data = await res.json();

                const container = document.getElementById('sources');
                container.innerHTML = data.sources.map((src, i) =>
                    '<div class="source-item">' +
                        '<div>' +
                            '<div class="source-name">' + src.name + '</div>' +
                            '<div class="source-url">' + src.url + '</div>' +
                        '</div>' +
                        '<div class="toggle ' + (src.enabled ? 'active' : '') + '" onclick="toggleSource(this, ' + i + ')"></div>' +
                    '</div>'
                ).join('');
            } catch (err) {
                console.error('Failed to load sources:', err);
            }
        }

        async function loadMappings() {
            try {
                const res = await fetch(apiBase + '/api/mappings');
                const data = await res.json();

                const container = document.getElementById('mappings');
                const entries = Object.entries(data.mappings);

                if (entries.length === 0) {
                    container.innerHTML = '<div class="loading">No mappings found</div>';
                    return;
                }

                container.innerHTML = entries.map(([alias, conf]) =>
                    '<div class="mapping-item">' +
                        '<div>' +
                            '<div class="mapping-name">' + alias + '</div>' +
                            '<div class="mapping-url">' + conf.addon_url + '</div>' +
                        '</div>' +
                        '<button class="secondary" onclick="deleteMapping(\'' + alias + '\')">Delete</button>' +
                    '</div>'
                ).join('');
            } catch (err) {
                console.error('Failed to load mappings:', err);
            }
        }

        async function toggleSource(el, index) {
            el.classList.toggle('active');
        }

        async function saveSources() {
            const status = document.getElementById('status');
            status.textContent = 'Saving sources...';
            status.className = 'loading';

            try {
                const sources = [];
                const items = document.querySelectorAll('.source-item');
                items.forEach((item, i) => {
                    const toggle = item.querySelector('.toggle');
                    sources.push({
                        name: item.querySelector('.source-name').textContent,
                        url: item.querySelector('.source-url').textContent,
                        enabled: toggle.classList.contains('active')
                    });
                });

                const res = await fetch(apiBase + '/api/sources', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sources: sources })
                });

                const data = await res.json();
                status.textContent = data.message || 'Sources saved';
                status.className = 'success';
            } catch (err) {
                status.textContent = 'Failed to save sources';
                status.className = 'error';
            }
        }

        async function cleanFailed() {
            const status = document.getElementById('status');
            status.textContent = 'Cleaning failed streams...';
            status.className = 'loading';

            try {
                await fetch(apiBase + '/api/clean', { method: 'POST' });
                status.textContent = 'Cleaned failed streams';
                status.className = 'success';
                await loadStats();
            } catch (err) {
                status.textContent = 'Failed to clean streams';
                status.className = 'error';
            }
        }

        async function clearCache() {
            const status = document.getElementById('status');
            status.textContent = 'Clearing cache...';
            status.className = 'loading';

            try {
                await fetch(apiBase + '/api/cache', { method: 'DELETE' });
                status.textContent = 'Cache cleared';
                status.className = 'success';
                await loadStats();
            } catch (err) {
                status.textContent = 'Failed to clear cache';
                status.className = 'error';
            }
        }

        async function deleteMapping(alias) {
            if (!confirm('Delete mapping "' + alias + '"?')) return;

            try {
                await fetch(apiBase + '/api/mappings?alias=' + encodeURIComponent(alias), {
                    method: 'DELETE'
                });
                await loadMappings();
            } catch (err) {
                alert('Failed to delete mapping');
            }
        }

        // Auto-refresh stats every 30 seconds
        setInterval(loadStats, 30000);

        // Load all data on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadSources();
            loadMappings();
        });
    </script>
</body>
</html>
