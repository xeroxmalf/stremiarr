name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.
  - type: input
    id: component
    attributes:
      label: Component
      description: Which service is affected?
      placeholder: "e.g., Handoff, Comet, Caddy, Rclone, Scripts"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Deploy stack with...
        2. Navigate to...
        3. See error...
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant logs (use `docker logs <service>`)
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, architecture
      placeholder: "Ubuntu 24.04, Docker 27.x, x86_64"
