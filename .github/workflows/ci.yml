name: Stremiarr CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-handoff:
    name: Handoff Service Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: handoff/src/go.sum

      - name: Initialize Go Module
        run: |
          cd handoff/src
          if [ ! -f go.mod ]; then
            go mod init stremiarr/handoff
          fi
          go mod tidy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: handoff/src

      - name: Run Unit Tests with Coverage
        run: |
          cd handoff/src
          go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Verify Build
        run: |
          cd handoff/src
          go build -v -o /dev/null ./...

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: handoff/src/coverage.out

  validate-configs:
    name: Validate Configs & Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linting Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck caddy python3-yaml

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: CI Suite (Static)
        run: |
          # Create dummy .env for validation
          cp compose/.env.example compose/.env
          ./scripts/ci.sh

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
